{% extends 'base.html' %}{% block title %}Request enterprise pricing{% endblock %}{% block content %}
<section class="login-card saas-card"><p class="eyebrow">ENTERPRISE</p><h1>Request custom pricing</h1><p class="muted">Tell us about your organization. Requests are reviewed by the Platform Owner and are never auto-approved.</p><form method="post" class="form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Company name<input name="company_name" maxlength="180" required></label><label>Contact name<input name="contact_name" maxlength="160" required></label><label>Work email<input type="email" name="email" maxlength="254" required></label><label>Phone<input name="phone" type="tel" maxlength="40"></label><div class="saas-name-row"><label>Estimated projects<input name="estimated_projects" maxlength="80" value="{{ request.args.get('projects','') }}"></label><label>Estimated users<input name="estimated_users" maxlength="80" value="{{ request.args.get('team','') }}"></label></div><label>Estimated storage<input name="estimated_storage" maxlength="80" placeholder="e.g. 2 TB"></label><label>Additional comments<textarea name="comments" maxlength="5000" rows="4">{% if request.args.get('billing') %}Interested in {{ request.args.get('billing') }} billing.{% endif %}</textarea></label><div class="website-field" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="button primary full">Send request →</button></form></section>
{% endblock %}
