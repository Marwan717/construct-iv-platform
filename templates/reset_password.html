{% extends 'base.html' %}{% block title %}Choose a new password{% endblock %}{% block content %}
<section class="login-card saas-card"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><form method="post" class="form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>New password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" required></label><button class="button primary full">Update password</button></form></section>{% endblock %}
