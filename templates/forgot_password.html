{% extends 'base.html' %}{% block title %}Reset password{% endblock %}{% block content %}
<section class="login-card saas-card"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password</h1><p class="muted">Enter the email address on your account. We’ll send a secure reset link if it exists.</p><form method="post" class="form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Work email<input type="email" name="email" autocomplete="email" maxlength="254" required></label><button class="button primary full">Send reset link</button></form><p class="fineprint"><a href="{{ url_for('login') }}">Back to sign in</a></p></section>{% endblock %}
